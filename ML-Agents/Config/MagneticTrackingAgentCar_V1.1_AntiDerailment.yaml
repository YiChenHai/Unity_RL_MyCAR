behaviors:
  MagneticTrackingAgentCar_V1.1_AntiDerailment:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.5e-4  # 降低学习率：由于惩罚机制增强（-15脱轨，-3预警），需要更稳定的学习
      beta: 5.0e-3
      epsilon: 0.15  # 降低探索率：避免在强惩罚环境下过度探索，更保守的策略更新
      lambd: 0.95
      num_epoch: 5  # 增加训练轮次：需要更充分的学习来适应新的惩罚机制
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995  # 提高折扣因子：更重视长期奖励，避免短期脱轨（从0.99提高到0.995）
        strength: 1.0
    max_steps: 20.0e6  # 增加训练步数：确保充分学习新的惩罚机制
    time_horizon: 512
    summary_freq: 5000          
    checkpoint_interval: 50000

# 配置说明：
# 1. 学习率降低：由于脱轨惩罚(-15)和预警惩罚(-3)都很强，需要更稳定的学习
# 2. 探索率降低：避免在强惩罚环境下过度探索，更保守的策略更新
# 3. 训练轮次增加：需要更充分的学习来适应新的惩罚机制
# 4. 折扣因子提高：更重视长期奖励，避免短期脱轨
# 5. 训练步数增加：确保充分学习新的惩罚机制
